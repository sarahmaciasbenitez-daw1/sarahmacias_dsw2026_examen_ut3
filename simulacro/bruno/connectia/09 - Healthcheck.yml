info:
  name: 09 - Healthcheck
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/health/live"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
