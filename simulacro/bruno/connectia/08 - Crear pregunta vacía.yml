info:
  name: 08 - Crear pregunta vacía
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/questions"
  body:
    type: json
    data: |-
      {
        "question": " "
      }
  auth: inherit

runtime:
