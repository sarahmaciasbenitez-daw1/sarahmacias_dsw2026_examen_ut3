info:
  name: 02 - Crear documento
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/documents"
  body:
    type: json
    data: |-
      {
        "title": "X"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.id
        method: jsonq
      variable:
        name: documentId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
